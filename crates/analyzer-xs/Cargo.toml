[package]
name = "analyzer-xs"
version = "0.1.0"
edition = "2024"
description = "XS glue: OpTree::Analyzer loadable from Perl via XSLoader"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
analyzer-core = { path = "../analyzer-core" }
analyzer-capture = { path = "../analyzer-capture" }
libperl-rs = { path = "../../../libperl-rs" }
serde_json = "1"

[build-dependencies]
libperl-config = { path = "../../../libperl-rs/libperl-config" }
