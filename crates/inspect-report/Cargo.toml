[package]
name = "inspect-report"
version = "0.1.0"
edition = "2024"
description = "Semantic JSON report (stash walk + provenance + argspec + uses) of a compiled embedded perl"
publish = false

[dependencies]
inspect-core = { path = "../inspect-core" }
inspect-capture = { path = "../inspect-capture" }
libperl-rs = "0.4.5"
serde_json = "1"

[build-dependencies]
libperl-config = "0.3.3"
