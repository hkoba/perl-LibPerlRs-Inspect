[package]
name = "inspect-cli"
version = "0.1.0"
edition = "2024"
description = "perl-inspect: compile a Perl file in an embedded interpreter, emit a semantic JSON report"
publish = false

[[bin]]
name = "perl-inspect"
path = "src/main.rs"

[dependencies]
inspect-core = { path = "../inspect-core" }
inspect-capture = { path = "../inspect-capture" }
libperl-rs = "0.4.4"
serde_json = "1"

[build-dependencies]
libperl-config = "0.3.3"
