[package]
name = "inspect-xs"
version = "0.1.0"
edition = "2024"
description = "XS glue: LibPerlRs::Inspect loadable from Perl via XSLoader"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
inspect-core = { path = "../inspect-core" }
inspect-capture = { path = "../inspect-capture" }
libperl-rs = "0.4.4"
serde_json = "1"

[build-dependencies]
libperl-config = "0.3.3"
